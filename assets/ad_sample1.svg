<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" width="1000" height="120">
  <defs>
    <linearGradient id="adGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f1f8e9;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f9fbe7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fffde7;stop-opacity:1" />
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@600;700&amp;display=swap');
      .bengali-text {
        font-family: 'Hind Siliguri', sans-serif;
        font-size: 26px;
        font-weight: 700;
      }
      .color-purple { fill: #4a148c; }
      .color-orange { fill: #e65100; }
      .address-text {
        font-family: sans-serif;
        font-size: 13px;
        font-weight: bold;
        fill: #ffffff;
      }
    </style>
  </defs>
  <!-- Background -->
  <rect width="1000" height="120" fill="url(#adGrad)" />

  <!-- Road Home Brand Section (Left) -->
  <g transform="translate(15, 10)">
    <!-- Chef Hat Icon -->
    <path d="M 32 32 C 32 20, 48 20, 48 28 C 48 20, 64 20, 64 32 C 68 32, 70 38, 62 42 C 62 44, 60 48, 54 48 C 50 48, 48 46, 48 44 C 48 46, 44 48, 38 48 C 32 48, 30 42, 34 40" fill="#e65100" />
    <rect x="36" y="44" width="24" height="6" rx="2" fill="#2e7d32" />
    
    <!-- Text logo -->
    <text x="75" y="44" font-family="sans-serif" font-weight="900" font-size="44" fill="#2e7d32" letter-spacing="-1">Road</text>
    <text x="75" y="84" font-family="sans-serif" font-weight="900" font-size="34" fill="#e65100" letter-spacing="-1">Home</text>
    <text x="75" y="100" font-family="sans-serif" font-size="10" fill="#212121" letter-spacing="1">Chinese &amp; Restaurant</text>
  </g>

  <!-- Middle Bengali Promotion (Center) -->
  <g transform="translate(260, 20)">
    <text x="0" y="32" class="bengali-text color-purple">স্বল্প মূল্যে উন্নতমানের</text>
    <text x="0" y="70" class="bengali-text color-orange" font-size="28">খাবারের</text>
    <text x="0" y="104" class="bengali-text color-purple">নির্ভরযোগ্য প্রতিষ্ঠান</text>
  </g>

  <!-- Stylized Food Collage Icon (Middle-Right) -->
  <g transform="translate(560, 10)">
    <circle cx="50" cy="50" r="42" fill="#e65100" opacity="0.1" />
    <circle cx="50" cy="50" r="38" fill="none" stroke="#e65100" stroke-width="2" stroke-dasharray="4,4" />
    <!-- Food bowl vector shapes -->
    <path d="M 32 48 Q 50 28 68 48 Z" fill="#2e7d32" />
    <path d="M 30 50 L 70 50 Q 66 75 50 75 Q 34 75 30 50 Z" fill="#e65100" />
    <line x1="26" y1="50" x2="74" y2="50" stroke="#ffffff" stroke-width="3" />
  </g>

  <!-- Right Section: Contact details -->
  <!-- Hotline label -->
  <rect x="680" y="12" width="130" height="30" rx="4" fill="#1b5e20" />
  <text x="745" y="32" font-family="sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle">HOTLINE</text>

  <!-- Hotline number -->
  <rect x="680" y="48" width="295" height="38" rx="4" fill="#0277bd" />
  <text x="827" y="74" font-family="sans-serif" font-weight="900" font-size="24" fill="#ffffff" text-anchor="middle">01788-773 028</text>

  <!-- Address line -->
  <path d="M 620 92 L 975 92 L 975 116 L 600 116 Z" fill="#e65100" />
  <text x="785" y="109" class="address-text" text-anchor="middle">31/1, Ahsan Ahmed Road (PTI More), Khulna.</text>
</svg>

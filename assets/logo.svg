<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 90" width="350" height="90">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@900&amp;display=swap');
      .logo-text {
        font-family: 'Noto Serif Bengali', 'SolaimanLipi', 'Kalpurush', serif;
        font-size: 45px;
        font-weight: 900;
        fill: #1a1a1a;
        letter-spacing: -1px;
      }
      .red-accent {
        fill: none;
        stroke: #d92323;
        stroke-width: 4.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </defs>
  <!-- Main brand text -->
  <text x="15" y="60" class="logo-text">খুলনা গেজেট</text>
  
  <!-- Red swoop accent under the 'খু' character loop matching the brand logo -->
  <path d="M 22 62 C 22 75, 42 75, 46 64 C 48 58, 40 50, 32 54 C 28 56, 26 62, 28 66" class="red-accent" />
</svg>

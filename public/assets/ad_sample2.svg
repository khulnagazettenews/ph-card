<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" width="1000" height="120">
  <defs>
    <linearGradient id="aciGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#e0f2fe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bae6fd;stop-opacity:1" />
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@700&amp;display=swap');
      .bengali-bold {
        font-family: 'Hind Siliguri', sans-serif;
        font-weight: 700;
      }
      .brand-title {
        font-size: 32px;
        fill: #0c4a6e;
      }
      .promo-text {
        font-size: 26px;
        fill: #0c4a6e;
      }
      .promo-sub {
        font-size: 32px;
        fill: #0f172a;
      }
    </style>
  </defs>
  <!-- Background -->
  <rect width="1000" height="120" fill="url(#aciGrad)" />

  <!-- ACI Logo Group -->
  <g transform="translate(25, 20)">
    <circle cx="40" cy="40" r="30" fill="#1b5e20" />
    <text x="40" y="49" font-family="sans-serif" font-weight="900" font-size="24" fill="#ffffff" text-anchor="middle">ACI</text>
    <text x="120" y="48" class="bengali-bold brand-title" font-size="34">ওয়াটার পাম্প</text>
  </g>

  <!-- Water splash SVG design (Center) -->
  <g transform="translate(300, 10)">
    <!-- Water pumps abstract shape representations -->
    <path d="M 40 40 Q 60 10 110 30 Q 140 50 160 30" fill="none" stroke="#0ea5e9" stroke-width="4" opacity="0.6" />
    
    <!-- Water pump motor 1 representation -->
    <rect x="50" y="45" width="45" height="30" rx="3" fill="#1b5e20" />
    <rect x="85" y="40" width="15" height="40" rx="2" fill="#374151" />
    <circle cx="62" cy="60" r="10" fill="#0284c7" />

    <!-- Water pump motor 2 representation -->
    <rect x="130" y="25" width="22" height="60" rx="2" fill="#0c4a6e" />
    <circle cx="141" cy="40" r="6" fill="#e2e8f0" />
  </g>

  <!-- Right Promo Section -->
  <g transform="translate(560, 25)">
    <text x="150" y="34" class="bengali-bold promo-text" text-anchor="middle">নতুন প্রজন্মের</text>
    <text x="150" y="74" class="bengali-bold promo-sub" text-anchor="middle">স্মার্ট সলিউশন</text>
  </g>
</svg>
